name: Deploy to Wedos

on:
  push:
    branches:
      - main
      - master
      - claude/ai-web-service-site-Ra9VF

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 391762.w62.wedos.net
          username: w391762
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /www/
          # Nový soubor se stavem: starý odkazoval na neexistující složku /www/CMS
          # a každé nasazení padalo na FTP 550 (od 11. 3. 2026).
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
            CLAUDE.md

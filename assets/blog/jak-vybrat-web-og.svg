<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e87a1e"/>
      <stop offset="50%" style="stop-color:#cd7f32"/>
      <stop offset="100%" style="stop-color:#d4a574"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative shapes -->
  <circle cx="1000" cy="100" r="200" fill="#e87a1e" opacity="0.15"/>
  <circle cx="200" cy="500" r="150" fill="#cd7f32" opacity="0.1"/>

  <!-- Browser window illustration -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="400" height="300" rx="20" fill="none" stroke="#e87a1e" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="50" x2="400" y2="50" stroke="#e87a1e" stroke-width="2" opacity="0.4"/>
    <circle cx="30" cy="25" r="8" fill="#e87a1e" opacity="0.5"/>
    <circle cx="55" cy="25" r="8" fill="#e87a1e" opacity="0.5"/>
    <circle cx="80" cy="25" r="8" fill="#e87a1e" opacity="0.5"/>

    <!-- Content blocks -->
    <rect x="20" y="70" width="160" height="80" rx="8" fill="#e87a1e" opacity="0.2"/>
    <rect x="200" y="70" width="180" height="35" rx="4" fill="#e87a1e" opacity="0.15"/>
    <rect x="200" y="115" width="140" height="35" rx="4" fill="#e87a1e" opacity="0.15"/>
    <rect x="20" y="170" width="360" height="50" rx="8" fill="#e87a1e" opacity="0.1"/>
    <rect x="20" y="240" width="120" height="40" rx="20" fill="url(#accent)" opacity="0.4"/>
  </g>

  <!-- Text -->
  <text x="580" y="280" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">Jak vybrat správný</text>
  <text x="580" y="340" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">typ webu pro</text>
  <text x="580" y="400" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#accent)">Váš byznys</text>

  <!-- Logo -->
  <text x="580" y="520" font-family="Arial, sans-serif" font-size="24" fill="#a0a0b8">zvelebil</text>
  <text x="710" y="520" font-family="Arial, sans-serif" font-size="24" fill="url(#accent)">.online</text>
</svg>
